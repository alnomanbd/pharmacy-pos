# The Dawai shop app: shop.dawai.com.bd
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------- security headers -----------------------------
    #
    # Set here rather than in the app: these have to be on every response,
    # including the ones nginx answers by itself (404s, redirects, static files).
    #
    # `always` matters - without it a header is dropped on exactly the error
    # responses an attacker is most likely to be looking at.

    # Only meaningful once TLS terminates in front of this; harmless before.
    # Do not add `preload` until the domain and every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app loads nothing from anywhere else. `frame-ancestors 'none'` is what
    # stops clickjacking, and `connect-src 'self'` is what keeps a compromised
    # dependency from posting a shop's books to a third party. Marketing tags
    # belong on the marketing site, never on this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and the manifest are looked up again on every visit,
    # or a phone keeps last month's worker. `expires` rather than add_header,
    # so the security headers above still apply here.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    # The API on this app's own origin. Same-origin means no CORS on the
    # authenticated surface and a host-only session cookie.
    location /api/ {
        proxy_pass http://api:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /health {
        proxy_pass http://api:5100/health;
    }
}
