# The Dawai operator console: console.dawai.com.bd
#
# Same shape as the clinic app with two differences, both deliberate: the
# console is never indexed, and it is meant to sit behind a network rule. The
# allow/deny block below is the place for it - uncomment and fill in the office
# or VPN range before this is exposed to the internet.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- who may reach this at all -------------------------------------------
    # An operator console is not a public surface. Restricting it here means a
    # stolen password is not enough on its own.
    #
    # allow 203.0.113.0/24;   # office
    # allow 10.8.0.0/24;      # VPN
    # deny  all;

    # ----------------------------- security headers -----------------------------
    #
    # Set here rather than in the app: these have to be on every response,
    # including the ones nginx answers by itself (404s, redirects, static files).
    #
    # `always` matters - without it a header is dropped on exactly the error
    # responses an attacker is most likely to be looking at.

    # Only meaningful once TLS terminates in front of this; harmless before.
    # Do not add `preload` until the domain and every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app loads nothing from anywhere else. `frame-ancestors 'none'` is what
    # stops clickjacking, and `connect-src 'self'` is what keeps a compromised
    # dependency from posting patient data to a third party. Marketing tags
    # belong on the marketing site, never on this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # Nothing here should ever appear in a search result or a link preview.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API on this app's own origin. Same-origin means no CORS on the
    # authenticated surface and a host-only session cookie.
    location /api/ {
        proxy_pass http://api:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /health {
        proxy_pass http://api:5100/health;
    }
}
